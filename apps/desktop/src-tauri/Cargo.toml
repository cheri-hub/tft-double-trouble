[package]
name = "double-trouble-tft"
version = "0.1.0"
description = "Double Trouble TFT desktop shell"
authors = ["Double Trouble TFT"]
edition = "2021"

[lib]
name = "double_trouble_tft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
