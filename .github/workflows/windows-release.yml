name: Windows release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Verify unit and component behavior
        run: pnpm test
      - name: Verify E2E types
        run: pnpm typecheck:e2e
      - name: Install Playwright browser
        run: pnpm exec playwright install chromium
      - name: Verify two-client synchronization
        run: pnpm exec playwright test
      - name: Build signed-ready Windows bundles
        run: pnpm --filter desktop tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: double-trouble-tft-windows-${{ github.run_number }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
